[project]
name = "voidx"
dynamic = ["version"]
description = "A coding agent that quantifies everything and solves with tools, not fuzzy prompts."
license = {text = "MIT"}
authors = [{name = "chikhamx"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.3.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "tiktoken>=0.8.0",
    "httpx>=0.28.0",
    "websockets>=14",
    "pathspec>=0.12",
	    "Pillow>=10.0.0; platform_system == 'Windows'",
]

[project.scripts]
voidx = "voidx.main:cli"

[project.optional-dependencies]
gemini = ["langchain-google-genai>=4.0.0"]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[dependency-groups]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "voidx.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"voidx.skills" = [
    "bundled/*/SKILL.md",
]
"voidx.data" = [
    "documents/**/*.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tui"]
testpaths = ["src/tests", "tui/tests"]
