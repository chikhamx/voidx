[package]
name = "voidx-macos-ocr"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFURL",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "CGAffineTransform",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGDataProvider",
    "CGImage",
    "CGPDFDocument",
    "CGPDFPage",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
] }
objc2-vision = "0.3.2"

[lib]
name = "voidx_macos_ocr"
path = "src/lib.rs"

[[bin]]
name = "voidx-macos-ocr"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
