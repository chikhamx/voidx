<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>voidx</title>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("voidx.theme");
          const resolved = preference === "light" || preference === "dark"
            ? preference
            : preference === "system"
              ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
              : "dark";
          document.documentElement.dataset.theme = resolved;
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <main class="vx-shell vx-workbench-shell">
      <!-- Titlebar -->
      <header class="vx-titlebar" data-tauri-drag-region>
        <div class="vx-titlebar-left" data-tauri-drag-region>
        </div>
        <div class="vx-titlebar-right" data-tauri-drag-region>
          <div class="vx-chat-header" id="chat-header" hidden>
            <span class="vx-chat-header-icon">
              <svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
            </span>
            <span class="vx-chat-header-title" id="chat-header-title"></span>
            <span class="vx-chat-header-mode" id="chat-header-mode" aria-live="polite"></span>
            <button type="button" class="vx-chat-header-btn" id="mode-status" hidden>状态</button>
            <button type="button" class="vx-chat-header-btn" id="mode-stop" hidden>停止</button>
            <button type="button" class="vx-chat-header-btn" id="chat-header-options" title="Options" aria-label="会话选项"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg></button>
          </div>
          <button type="button" class="vx-titlebar-tool" id="titlebar-dock-toggle" aria-label="Toggle right panel"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M14.5 4v16"/></svg></button>
        </div>
      </header>

      <!-- Workbench body -->
      <div class="vx-body">
        <!-- Left sidebar -->
        <aside class="vx-sidebar" id="sidebar">
          <div class="vx-mode-picker" id="runtime-profile-switcher">
            <button type="button" class="vx-mode-trigger" id="mode-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="切换运行模式">
              <span class="vx-mode-trigger-label" id="mode-trigger-label">编码</span>
              <span class="vx-sidebar-row-icon"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9.5 6 6 6-6"/></svg></span>
            </button>
            <div class="vx-mode-menu" id="mode-menu" role="listbox" hidden>
              <button type="button" class="vx-mode-option" data-profile="chat" role="option" aria-selected="false">
                <span class="vx-mode-option-text"><span class="vx-mode-option-name">聊天</span><span class="vx-mode-option-desc">自由对话与问答</span></span>
                <span class="vx-mode-option-check"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg></span>
              </button>
              <button type="button" class="vx-mode-option" data-profile="coding" role="option" aria-selected="true">
                <span class="vx-mode-option-text"><span class="vx-mode-option-name">编码</span><span class="vx-mode-option-desc">构建、调试与发布</span></span>
                <span class="vx-mode-option-check"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg></span>
              </button>
              <button type="button" class="vx-mode-option" data-profile="goal" role="option" aria-selected="false">
                <span class="vx-mode-option-text"><span class="vx-mode-option-name">目标</span><span class="vx-mode-option-desc">按目标持续推进</span></span>
                <span class="vx-mode-option-check"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg></span>
              </button>
              <button type="button" class="vx-mode-option" data-profile="loop" role="option" aria-selected="false">
                <span class="vx-mode-option-text"><span class="vx-mode-option-name">循环</span><span class="vx-mode-option-desc">周期性自动执行</span></span>
                <span class="vx-mode-option-check"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg></span>
              </button>
            </div>
          </div>
          <nav class="vx-sidebar-nav" aria-label="Workspace navigation">
            <button type="button" class="vx-nav-item vx-new-chat" id="btn-new-chat">
              <span class="vx-sidebar-row-icon"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
              <span>新建会话</span>
            </button>

            <label class="vx-nav-item vx-search-item">
              <span class="vx-sidebar-row-icon"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m15.8 15.8 4.7 4.7"/></svg></span>
              <input type="text" class="vx-search" id="session-search" placeholder="搜索会话..." />
            </label>
            <button type="button" class="vx-nav-item vx-hidden-action" id="btn-integrations" hidden>插件</button>
          </nav>
          <div class="vx-sidebar-section" id="temporary-session-section" hidden>
            <div class="vx-sidebar-heading"><span class="vx-sidebar-row-icon">•</span><span>临时会话</span></div>
            <div class="vx-session-list" id="temporary-session-list"></div>
          </div>
          <div class="vx-sidebar-section vx-project-session-section" id="project-session-section">
            <div class="vx-sidebar-heading vx-project-heading">
              <span class="vx-project-heading-label">项目</span>
              <button type="button" class="vx-project-add" id="btn-open-workspace" title="打开项目" aria-label="打开项目">+</button>
            </div>
            <div class="vx-session-list" id="session-list"></div>
          </div>
          <div class="vx-sidebar-section" id="recent-session-section" hidden>
            <button type="button" class="vx-sidebar-heading vx-recent-heading" id="recent-session-heading" aria-expanded="true" aria-controls="recent-session-list">
              <span>最近会话</span>
              <span class="vx-sidebar-heading-chevron" aria-hidden="true"></span>
            </button>
            <div class="vx-session-list" id="recent-session-list"></div>
          </div>


          <div class="vx-sidebar-footer">
            <button type="button" class="vx-nav-item" id="btn-settings">
              <span class="vx-sidebar-row-icon"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></span>
              <span>设置</span>
            </button>
            <button type="button" class="vx-nav-item" id="btn-account">
              <span class="vx-sidebar-row-icon"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 20.5c.9-3.6 3.5-5.5 7-5.5s6.1 1.9 7 5.5"/></svg></span>
              <span>账户</span>
            </button>
            <button type="button" class="vx-nav-item vx-theme-toggle" id="btn-theme-toggle" aria-label="切换主题">
              <span class="vx-sidebar-row-icon"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg></span>
              <span>主题</span>
            </button>
          </div>
        </aside>
        <div class="vx-sidebar-resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="调整侧栏宽度"></div>

        <!-- Main area -->
        <section class="vx-main">
          <div class="vx-main-canvas">
            <section class="vx-empty-state" id="empty-state" aria-live="polite">
              <h1>一起让世界变得更加美好！</h1>
              <div class="vx-empty-suggestions" id="empty-suggestions">
                <button type="button" class="vx-suggestion-chip" data-prompt="帮我解释这段代码的工作原理">解释代码</button>
                <button type="button" class="vx-suggestion-chip" data-prompt="帮我修复这个 bug：">修复 Bug</button>
                <button type="button" class="vx-suggestion-chip" data-prompt="为这个函数编写单元测试">编写测试</button>
                <button type="button" class="vx-suggestion-chip" data-prompt="帮我重构这部分逻辑，让它更清晰">重构代码</button>
              </div>
            </section>
            <div class="transcript" id="transcript" aria-live="polite"></div>
          <form class="composer" id="composer">
            <div class="attachment-strip" id="attachment-strip" hidden></div>
            <div class="slash-menu" id="slash-menu"></div>
            <div class="ref-menu" id="ref-menu"></div>
            <textarea id="input" rows="3" placeholder="Ask voidx... (/ 命令, @ 文件, # 技能)"></textarea>
            <div class="vx-composer-actions">
              <div class="vx-composer-left">
                <button type="button" class="vx-attach-btn" id="btn-attach" aria-label="Add context"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
                <div class="vx-permission-selector-container">
                  <div class="vx-permission-pill" id="permission-pill" title="点击配置权限">
                    <svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-3.5 8-10V5l-8-3-8 3v7c0 6.5 8 10 8 10Z"/></svg>
                    <span id="permission-pill-text">安全模式</span>
                  </div>
                  <div class="vx-permission-dropdown" id="permission-dropdown" hidden></div>
                </div>
              </div>
              <div class="vx-composer-right">
                <select id="provider-select" aria-label="Provider" style="display: none;"></select>
                <select id="model-select" aria-label="Model" style="display: none;"></select>

                <div class="vx-model-selector-container">
                  <button type="button" class="vx-model-pill" id="model-pill">
                    <span id="model-pill-text">等待模型状态</span>
                  </button>
                  <div class="vx-model-dropdown" id="model-dropdown" hidden></div>
                </div>

                <div class="vx-reasoning-selector-container">
                  <button type="button" class="vx-reasoning-pill" id="reasoning-pill" title="推理强度">
                    <span id="reasoning-pill-text">极</span>
                  </button>
                  <div class="vx-reasoning-dropdown" id="reasoning-dropdown" hidden></div>
                </div>

                <button type="submit" class="btn-send" id="btn-send" aria-label="Send"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
              </div>
            </div>
            <div class="vx-runtime-status-line" id="runtime-status-line" role="status" aria-live="polite" hidden></div>
          </form>

          <div class="context-menu" id="context-menu" hidden>
            <div class="context-menu-title">添加</div>
            <button type="button" class="context-menu-item" data-action="file">
              <span class="context-menu-icon"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></span>
              <span>文件和文件夹</span>
              <span class="context-menu-detail">添加路径到上下文</span>
            </button>
            <button type="button" class="context-menu-item" data-action="model">
              <span class="context-menu-icon"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg></span>
              <span>供应商 / 模型</span>
              <span class="context-menu-detail">新增或配置模型</span>
            </button>
            <button type="button" class="context-menu-item" data-action="paste">
              <span class="context-menu-icon"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2.5" width="8" height="3.5" rx="1"/><path d="M16 4.5h2a2 2 0 0 1 2 2V20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2h2"/></svg></span>
              <span>剪贴板图片</span>
              <span class="context-menu-detail">粘贴图片上下文</span>
            </button>
            <div class="context-menu-title">插件</div>
            <button type="button" class="context-menu-item" data-action="skills">
              <span class="context-menu-icon"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 13.6 7.6l4.4 1.8-4.4 1.8L12 15.5l-1.6-4.3-4.4-1.8 4.4-1.8Z"/><path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9Z"/></svg></span>
              <span>技能</span>
              <span class="context-menu-detail">管理 Skills</span>
            </button>
            <button type="button" class="context-menu-item" data-action="integrations">
              <span class="context-menu-icon"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.4 7.3a1 1 0 0 0-1.4 0l-2.3-.8a2.1 2.1 0 1 0-4.2 0l-2.2.8a1 1 0 0 0-.7 1V11a2.1 2.1 0 1 0 0 4.2V18a1 1 0 0 0 1 1h7.8a1 1 0 0 0 1-1v-2.6a2.1 2.1 0 1 1 0-4.2V8.3a1 1 0 0 0 1-1Z"/></svg></span>
              <span>插件</span>
              <span class="context-menu-detail">MCP / Web / LSP</span>
            </button>
          </div>
          <div class="vx-context-row" id="context-row" hidden>
            <span id="context-workspace">voidx</span>
            <span id="context-provider-model"></span>
          </div>
        </div>
        </section>

        <!-- Right sidebar (Dock) -->
        <aside class="vx-dock collapsed" id="dock">
          <div class="vx-dock-tabs">
            <button class="vx-dock-tab active" data-tab="todo" aria-selected="true">Todo</button>
            <button class="vx-dock-tab" data-tab="terminal" aria-selected="false">Terminal</button>
            <button class="vx-dock-tab" data-tab="diff" aria-selected="false">Diff</button>
            <button class="vx-dock-tab" data-tab="status" aria-selected="false">Status</button>
            <button class="vx-dock-toggle" id="dock-toggle" aria-label="Toggle right panel"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M14.5 4v16"/></svg></button>
          </div>
          <div class="vx-dock-strip" id="dock-strip" hidden>
            <span class="status-session" id="status-session"></span>
            <span id="strip-workspace">voidx</span>
            <span id="strip-provider-model"></span>
            <span id="strip-ai-approval" hidden></span>
          </div>
          <div class="vx-dock-content" id="dock-content">
            <div class="vx-dock-pane" data-pane="todo">
              <section class="todo-panel" id="todo-panel" aria-label="Task progress"></section>
            </div>
            <div class="vx-dock-pane" data-pane="terminal" hidden>
              <div class="vx-terminal" id="terminal-pane"></div>
            </div>
            <div class="vx-dock-pane" data-pane="diff" hidden>
              <div class="vx-diff-review" id="diff-pane"></div>
            </div>
            <div class="vx-dock-pane" data-pane="status" hidden>
              <dl class="vx-status-grid" id="status-panel">
                <div><dt>Connection</dt><dd id="status-connection">disconnected</dd></div>
                <div><dt>Session</dt><dd id="status-session-detail"></dd></div>
                <div><dt>Workspace</dt><dd id="status-workspace-detail">voidx</dd></div>
                <div><dt>Model</dt><dd id="status-provider-model"></dd></div>
                <div><dt>Running</dt><dd id="status-running">idle</dd></div>
                <div><dt>Usage</dt><dd id="status-usage">—</dd></div>
                <div id="status-ai-approval-row" hidden><dt>AI approvals</dt><dd id="status-ai-approval">0</dd></div>
              </dl>
            </div>
          </div>
        </aside>
      </div>

      <!-- Integrations panel -->
      <dialog id="integrations-dialog" class="settings-dialog integrations-dialog">
        <form id="integrations-form" method="dialog">
          <header class="settings-header">
            <div>
              <h2>插件</h2>
              <p>管理 MCP、Web Search、Skills 和 LSP</p>
            </div>
            <button type="button" id="integrations-close" aria-label="Close integrations"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7 7 17M7 7l10 10"/></svg></button>
          </header>
          <div id="integrations-content" class="settings-content"></div>
        </form>
      </dialog>

      <!-- Settings modal -->
      <dialog id="settings-dialog" class="settings-dialog">
        <form id="settings-form" method="dialog">
          <header class="settings-header">
            <div>
              <h2>设置</h2>
              <p id="settings-summary">模型、权限、偏好、IDE 和高级</p>
            </div>
            <button type="button" id="settings-close" aria-label="Close settings"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7 7 17M7 7l10 10"/></svg></button>
          </header>
          <nav class="settings-tabs" id="settings-tabs">
            <button type="button" data-tab="model" class="settings-tab active">模型</button>
            <button type="button" data-tab="permissions" class="settings-tab">权限</button>
            <button type="button" data-tab="preferences" class="settings-tab">偏好</button>
            <button type="button" data-tab="code" class="settings-tab">代码</button>
            <button type="button" data-tab="advanced" class="settings-tab">高级</button>
          </nav>
          <div id="settings-content" class="settings-content"></div>
          <footer class="settings-footer">
            <span id="settings-error" class="settings-error" role="alert"></span>
            <button type="button" id="settings-save" class="settings-save">保存</button>
          </footer>
        </form>
      </dialog>
      <!-- Providers / models manager modal -->
      <dialog id="providers-dialog" class="settings-dialog providers-dialog">
        <form id="providers-form" method="dialog">
          <header class="settings-header">
            <div>
              <h2>供应商 / 模型</h2>
              <p>管理已配置的模型供应商，或添加新的供应商</p>
            </div>
            <button type="button" id="providers-close" aria-label="Close providers"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7 7 17M7 7l10 10"/></svg></button>
          </header>
          <div id="providers-content" class="settings-content"></div>
          <footer class="settings-footer">
            <span id="providers-error" class="settings-error" role="alert"></span>
          </footer>
        </form>
      </dialog>
      <dialog id="request-dialog" class="request-dialog">
        <form id="request-form" method="dialog">
          <h2 id="request-title"></h2>
          <div id="request-details"></div>
          <div id="request-controls"></div>
        </form>
      </dialog>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
