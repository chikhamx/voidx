<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>voidx Web</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>voidx</h1>
          <p id="status">Disconnected</p>
        </div>
      </header>
      <section class="transcript" id="transcript" aria-live="polite"></section>
      <form class="composer" id="composer">
        <textarea id="input" rows="3" placeholder="Ask voidx..."></textarea>
        <button type="submit">Send</button>
      </form>
      <section class="events" id="events" aria-label="Live UI events"></section>
      <dialog id="request-dialog" class="request-dialog">
        <form id="request-form" method="dialog">
          <h2 id="request-title"></h2>
          <div id="request-details"></div>
          <div id="request-controls"></div>
        </form>
      </dialog>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
