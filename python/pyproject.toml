[project]
name = "voidx"
version = "2.0.0"
description = "A coding agent that quantifies everything — Rust core, Python UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.0",
]

[project.scripts]
voidx = "voidx.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
